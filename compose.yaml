services:
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./reports:/app/reports:ro
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build: .
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./reports:/app/reports:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s